name: alertaya
description: AlertaYa - Botón de pánico con alerta SOS por SMS, WhatsApp y llamada
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  geolocator: '>=13.0.0 <15.0.0'
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/imagen.png"
  adaptive_icon_background: "#D32F2F"
  adaptive_icon_foreground: "assets/images/imagen.png"
  remove_alpha_ios: true
